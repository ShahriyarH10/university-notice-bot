name: Hourly Notice Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Runs share the state file in the repo, so they must never overlap.
concurrency:
  group: notice-scraper
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m notice_bot

      # Runs even when the scraper failed part-way: notices that were already
      # delivered must be recorded, or the next run would send them again.
      - name: Commit and push state file
        if: ${{ !cancelled() && steps.scraper.conclusion != 'skipped' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain last_notices.json)" ]; then
            git add last_notices.json
            git commit -m "chore: update notice state [skip ci]"
            git push
          else
            echo "State unchanged — nothing to commit."
          fi

      - name: Notify on job failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ AIUB Scraper Failed
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
