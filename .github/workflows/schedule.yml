name: Hourly Notice Scraper

on:
  schedule:
    # Every 45 minutes, off the hour. GitHub delays or drops many scheduled runs
    # (an hourly cron fired only every 4-8 hours), so extra slots keep the gap
    # short. The concurrency group below stops runs overlapping; minutes are free
    # for public repos.
    # Cron can't count 45 minutes across hours, so these four lines repeat every
    # 3 hours: 00:07, 00:52, 01:37, 02:22, 03:07, … (UTC).
    - cron: '7 0-23/3 * * *'
    - cron: '52 0-23/3 * * *'
    - cron: '37 1-23/3 * * *'
    - cron: '22 2-23/3 * * *'
  workflow_dispatch:
    inputs:
      resync:
        description: 'Record the whole board as sent without sending it (clears the "never seen before" guard)'
        type: boolean
        default: false

# Runs share the state file in the repo, so they must never overlap.
concurrency:
  group: notice-scraper
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read  # to look up earlier runs for the failure alert

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESYNC: ${{ inputs.resync && '--resync' || '' }}
        run: python -m notice_bot $RESYNC

      # Runs even when the scraper failed part-way: notices that were already
      # delivered must be recorded, or the next run would send them again.
      - name: Commit and push state file
        if: ${{ !cancelled() && steps.scraper.conclusion != 'skipped' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain last_notices.json)" ]; then
            git add last_notices.json
            git commit -m "chore: update notice state [skip ci]"
            # If main moved during the run (e.g. a code push), a plain push is
            # rejected and the state would be lost, re-sending these notices.
            for attempt in 1 2 3; do
              if git pull --rebase --quiet; then
                git push && exit 0
              else
                git rebase --abort || true
              fi
              echo "Push attempt ${attempt} failed; retrying."
              sleep $((attempt * 5))
            done
            echo "::error::Could not push the state file; delivered notices may be sent again."
            exit 1
          else
            echo "State unchanged — nothing to commit."
          fi

      # One message when the bot starts failing and one when it recovers, rather
      # than one every hour. A single failed run (e.g. a Cloudflare challenge)
      # stays quiet: nothing is lost, the next run picks up the missed notices.
      - name: Report failure or recovery
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ALERT_AFTER: 3  # failed runs in a row before alerting (about 2 hours)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          notify() {
            curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode text="$1" > /dev/null
          }

          # Count the failures in a row just before this run, newest first.
          if conclusions=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow schedule.yml \
              --branch "$GITHUB_REF_NAME" --status completed --limit 20 \
              --json conclusion --jq '.[].conclusion | select(. == "success" or . == "failure")'); then
            streak=0
            for conclusion in $conclusions; do
              [ "$conclusion" = failure ] || break
              streak=$((streak + 1))
            done
          else
            echo "::warning::Could not read earlier runs; alerting on any failure."
            streak=$((ALERT_AFTER - 1))
          fi
          echo "Status: $JOB_STATUS; failed runs just before this one: $streak"

          if [ "$JOB_STATUS" != success ]; then
            if [ $((streak + 1)) -eq "$ALERT_AFTER" ]; then
              notify "⚠️ AIUB notice bot has failed ${ALERT_AFTER} runs in a row. New notices will be sent once it works again.
          Latest run: ${RUN_URL}"
            fi
          elif [ "$streak" -ge "$ALERT_AFTER" ]; then
            notify "✅ AIUB notice bot is working again after ${streak} failed runs."
          fi
